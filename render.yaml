services:
  - type: web
    name: zhonnex-aios-core
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false